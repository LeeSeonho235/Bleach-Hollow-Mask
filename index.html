<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bleach Hollow Mask</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    body { margin: 0; overflow: hidden; background-color: #000; }
    
    /* 영압 비디오 - 안 보이게 (but not display:none!) */
    #aura-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    
    /* 카메라 비디오 - 안 보이게 (but not display:none!) */
    #v_src {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    
    /* 캔버스 - 모든 것을 여기에! */
    #out {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
    }
    
    .status {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      z-index: 10;
    }
  </style>
</head>
<body>
  <!-- 영압 배경 비디오 -->
  <video id="aura-video" autoplay loop muted playsinline>
    <source src="assets/ichigo_reiatsu.mp4" type="video/mp4">
  </video>
  
  <video id="v_src" autoplay playsinline></video>
  <canvas id="out"></canvas>
  
  <div class="status">
    <div>🎭 마스크: <span id="mask-status">로딩중...</span></div>
    <div>🔥 영압: <span id="aura-status">로딩중...</span></div>
  </div>

  <script>
    const vElement = document.getElementById('v_src');
    const cElement = document.getElementById('out');
    const ctx = cElement.getContext('2d');
    const maskStatus = document.getElementById('mask-status');
    const auraStatus = document.getElementById('aura-status');
    const auraVideo = document.getElementById('aura-video');

    let handResults = null;
    let faceResults = null;
    
    // 영압 비디오 상태 모니터링
    auraVideo.onloadeddata = () => {
        auraStatus.textContent = '✅ 준비됨';
        console.log('✅ 영압 비디오 로드 완료!');
        auraVideo.play().catch(e => console.error('영압 재생 실패:', e));
    };
    auraVideo.onerror = () => {
        auraStatus.textContent = '❌ 로드 실패';
        console.error('❌ 영압 비디오 로드 실패!');
    };
    auraVideo.onplay = () => {
        console.log('✅ 영압 재생 중!');
    };
    
    // 호로 마스크 이미지 로드
    const fullMaskImg = new Image();
    fullMaskImg.src = 'assets/hollow_mask.png';  // 파일명 수정!
    fullMaskImg.onload = () => {
        maskStatus.textContent = '✅ 준비됨';
        console.log('✅ 호로 마스크 로드 완료!');
    };
    fullMaskImg.onerror = () => {
        maskStatus.textContent = '❌ 로드 실패';
        console.error('❌ 호로 마스크 로드 실패!');
    };

    // 그리기 함수
    function draw() {
        // 비디오가 준비되지 않았으면 그리지 않음
        if (!vElement.videoWidth || !vElement.videoHeight) {
            requestAnimationFrame(draw);
            return;
        }

        cElement.width = vElement.videoWidth;
        cElement.height = vElement.videoHeight;
        const w = cElement.width;
        const h = cElement.height;

        ctx.save();
        ctx.clearRect(0, 0, w, h);

        // 1. 카메라 영상 먼저 그리기 (배경)
        ctx.drawImage(vElement, 0, 0, w, h);

        // 2. 영압 그리기 (더 진하게!)
        if (auraVideo.readyState >= 2) {
            try {
                // 영압 비디오 크기 계산
                const auraAspect = auraVideo.videoWidth / auraVideo.videoHeight;
                const auraWidth = w;
                const auraHeight = auraWidth / auraAspect;
                
                // 맨 밑에 배치 (동그라미가 화면 맨 밑에)
                const auraY = h - auraHeight;
                
                // screen 블렌드 모드 - 어두운 부분(초록/검정) 투명!
                ctx.globalCompositeOperation = 'screen';
                ctx.globalAlpha = 1.0;  // 완전 불투명 - 진하게!
                ctx.drawImage(auraVideo, 0, auraY, auraWidth, auraHeight);
                
                // 원래 모드로 복원
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;
            } catch (e) {
                console.error('영압 그리기 실패:', e);
            }
        }

        // 3. 손 그리기
        if (handResults?.multiHandLandmarks) {
            handResults.multiHandLandmarks.forEach((pts) => {
                drawConnectors(ctx, pts, HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 4 });
                drawLandmarks(ctx, pts, { color: '#FF0000', lineWidth: 2, radius: 4 });
            });
        }

        // 4. 얼굴 그리기
        if (faceResults?.multiFaceLandmarks) {
            faceResults.multiFaceLandmarks.forEach((landmarks) => {
                // 얼굴 메쉬
                drawConnectors(ctx, landmarks, FACEMESH_TESSELATION, { color: '#C0C0C070', lineWidth: 1 });
                drawConnectors(ctx, landmarks, FACEMESH_RIGHT_EYE, { color: '#FF3030' });
                drawConnectors(ctx, landmarks, FACEMESH_LEFT_EYE, { color: '#30FF30' });
                drawConnectors(ctx, landmarks, FACEMESH_LIPS, { color: '#E0E0E0' });

                // 5. 마스크 그리기
                if (fullMaskImg.complete) {
                    drawFullMask(landmarks);
                }
            });
        }

        ctx.restore();
    }

    // 전체 마스크 그리기 (양쪽 눈 맞춤!)
    function drawFullMask(landmarks) {
        const w = cElement.width;
        const h = cElement.height;

        // 양쪽 눈 위치
        const leftEye = landmarks[468];   // 왼쪽 눈 중심
        const rightEye = landmarks[473];  // 오른쪽 눈 중심

        // 두 눈 사이 거리
        const eyeDistanceX = Math.abs(leftEye.x - rightEye.x) * w;
        
        // 두 눈 중심점
        const eyesCenterX = ((leftEye.x + rightEye.x) / 2) * w;
        const eyesCenterY = ((leftEye.y + rightEye.y) / 2) * h;

        // 마스크 크기 (눈 거리 기준 - 작게!)
        const maskWidth = eyeDistanceX * 2.8;  // 눈 거리의 2.8배로 축소
        const maskHeight = maskWidth * (fullMaskImg.height / fullMaskImg.width) * 0.6;  // 높이 40% 축소

        // 마스크 이미지에서 눈들의 상대 위치 (이미지의 약 50% 가로, 35% 세로)
        const maskEyesCenterX = maskWidth * 0.5;
        const maskEyesCenterY = maskHeight * 0.35;

        // 마스크 위치 계산 (마스크의 눈 중심 = 실제 눈 중심)
        const maskX = eyesCenterX - maskEyesCenterX;
        const maskY = eyesCenterY - maskEyesCenterY;

        // 마스크 그리기 (원본 방향)
        ctx.save();
        ctx.scale(-1, 1);  // 미러링 상쇄
        ctx.drawImage(
            fullMaskImg,
            -(maskX + maskWidth),
            maskY,
            maskWidth,
            maskHeight
        );
        ctx.restore();
    }

    // 손 결과 처리
    function onHandResults(results) {
        handResults = results;
        draw();
    }

    // 얼굴 결과 처리
    function onFaceResults(results) {
        faceResults = results;
        draw();
    }

    // MediaPipe Hands 초기화
    const hands = new Hands({
        locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });
    hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });
    hands.onResults(onHandResults);

    // MediaPipe Face Mesh 초기화
    const faceMesh = new FaceMesh({
        locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
    });
    faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });
    faceMesh.onResults(onFaceResults);

    // 카메라 시작
    const cam = new Camera(vElement, {
        onFrame: async () => { 
            await hands.send({ image: vElement });
            await faceMesh.send({ image: vElement });
        },
        width: 1280, 
        height: 720
    });
    
    cam.start();

    console.log('✅ 간단 버전: 전체 마스크만!');
  </script>
</body>
</html>
