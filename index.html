<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaPipe - 손 + 얼굴 인식</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    body { margin: 0; overflow: hidden; background-color: #111; }
    #v_src, #out {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; transform: scaleX(-1);
    }
    #out { z-index: 2; pointer-events: none; }
  </style>
</head>
<body>
  <!-- 비디오 1개만! -->
  <video id="v_src" autoplay playsinline></video>
  <!-- 캔버스 1개만! -->
  <canvas id="out"></canvas>

  <script>
    const vElement = document.getElementById('v_src');
    const cElement = document.getElementById('out');
    const ctx = cElement.getContext('2d');

    let handResults = null;
    let faceResults = null;

    // 그리기 함수
    function draw() {
        cElement.width = vElement.videoWidth;
        cElement.height = vElement.videoHeight;

        ctx.save();
        ctx.clearRect(0, 0, cElement.width, cElement.height);

        // 손 그리기
        if (handResults?.multiHandLandmarks) {
            handResults.multiHandLandmarks.forEach((pts) => {
                drawConnectors(ctx, pts, HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 4 });
                drawLandmarks(ctx, pts, { color: '#FF0000', lineWidth: 2, radius: 4 });
            });
        }

        // 얼굴 그리기 (Face Mesh)
        if (faceResults?.multiFaceLandmarks) {
            faceResults.multiFaceLandmarks.forEach((landmarks) => {
                drawConnectors(ctx, landmarks, FACEMESH_TESSELATION, { color: '#C0C0C070', lineWidth: 1 });
                drawConnectors(ctx, landmarks, FACEMESH_RIGHT_EYE, { color: '#FF3030' });
                drawConnectors(ctx, landmarks, FACEMESH_LEFT_EYE, { color: '#30FF30' });
                drawConnectors(ctx, landmarks, FACEMESH_LIPS, { color: '#E0E0E0' });
            });
        }

        ctx.restore();
    }

    // 손 결과 처리
    function onHandResults(results) {
        handResults = results;
        draw();
    }

    // 얼굴 결과 처리
    function onFaceResults(results) {
        faceResults = results;
        draw();
    }

    // MediaPipe Hands 초기화
    const hands = new Hands({
        locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });
    hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });
    hands.onResults(onHandResults);

    // MediaPipe Face Mesh 초기화
    const faceMesh = new FaceMesh({
        locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
    });
    faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });
    faceMesh.onResults(onFaceResults);

    // 카메라 시작
    const cam = new Camera(vElement, {
        onFrame: async () => { 
            await hands.send({ image: vElement });
            await faceMesh.send({ image: vElement });
        },
        width: 1280, 
        height: 720
    });
    
    cam.start();

    console.log('✅ 손 + 얼굴 동시 추적!');
  </script>
</body>
</html>
